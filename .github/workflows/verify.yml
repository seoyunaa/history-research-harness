name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Guardrail check (verify.py)
        run: python tools/verify.py
      - name: Harness structure check
        run: python tools/check_harness_hierarchy.py
      - name: md2hwpx tests
        run: python tools/test_md2hwpx.py
